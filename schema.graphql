type Approval @entity(immutable: true) {
  id: Bytes!
  owner: Bytes! # address
  spender: Bytes! # address
  value: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# 实际收过或转出过代币的地址。0 地址只表示铸币/销毁，不建用户。
# 余额由 Transfer 事件累加，单位是代币原始值（未除 decimals）。
type User @entity(immutable: false) {
  id: Bytes! # address
  balance: BigInt!
  sentTransfers: [Transfer!]! @derivedFrom(field: "from")
  receivedTransfers: [Transfer!]! @derivedFrom(field: "to")
  balanceSnapshots: [BalanceSnapshot!]! @derivedFrom(field: "user")
}

# 某次转账之后的余额。查某区块高度时，取 blockNumber 不超过该高度、sortKey 最大的一条；没有记录则当时余额为 0。
type BalanceSnapshot @entity(immutable: true) {
  id: Bytes!
  user: User!
  balance: BigInt!
  blockNumber: BigInt!
  logIndex: BigInt!
  sortKey: BigInt! # blockNumber * 2^32 + logIndex，同一区块内按日志顺序取最后一笔
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Transfer @entity(immutable: true) {
  id: Bytes!
  from: User # 铸币时为空
  to: User # 销毁时为空
  value: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}
