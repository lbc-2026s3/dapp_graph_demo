specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: UPT26
    network: sepolia
    source:
      address: "0xc9423ee04f2afa3a4f73fa5a21427543a7a5edbe"
      abi: UPT26
      startBlock: 10663818
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Approval
        - Transfer
        - User
        - BalanceSnapshot
      abis:
        - name: UPT26
          file: ./abis/UPT26.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/upt-26.ts
